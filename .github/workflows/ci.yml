name: Explorer CI

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: explorer-ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Type-check and build
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Check out source
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false

      - name: Validate shell scripts
        run: for script in scripts/*.sh; do bash -n "$script"; done

      - name: Set up Node.js
        uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version-file: '.nvmrc'
          cache: yarn
          cache-dependency-path: yarn.lock

      - name: Enable Corepack
        run: corepack enable

      - name: Install locked dependencies
        run: yarn install --frozen-lockfile --ignore-scripts --non-interactive

      - name: Test validator profile data
        run: yarn test

      - name: Type-check and build
        run: yarn build
        env:
          NODE_OPTIONS: --max_old_space_size=4096

      - name: Audit locked dependencies
        run: node scripts/audit-locked.mjs

      - name: Install Chromium
        run: yarn playwright install --with-deps chromium

      - name: Test Xitcoin wallet dialogs without signing or broadcasting
        run: |
          yarn preview --host 0.0.0.0 --port 4176 > /tmp/explorer-preview.log 2>&1 &
          preview_pid=$!
          trap 'kill "$preview_pid"' EXIT
          for _attempt in $(seq 1 30); do
            if curl -fsS http://localhost:4176/ > /dev/null; then break; fi
            sleep 1
          done
          yarn test:browser
